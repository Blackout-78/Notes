name: Build Notes APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: "8.7"

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret $v. Add all three secrets in Settings > Secrets and variables > Actions, then re-run."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notes.jks"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/notes.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          VNAME=$(tr -d '[:space:]' < VERSION)
          gradle --no-daemon assembleRelease -PversionName="$VNAME" -PversionCode="${{ github.run_number }}"

      - name: Remove the decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/notes.jks"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VNAME=$(tr -d '[:space:]' < VERSION)
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest app/build/outputs/apk/release/app-release.apk \
            --title "Notes $VNAME apk (Build ${{ github.run_number }})" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
