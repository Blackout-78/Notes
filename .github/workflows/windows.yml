name: Build Notes Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install "PySide6>=6.7,<6.10" pyinstaller

      - name: Build app
        run: |
          VNAME=$(tr -d '[:space:]' < VERSION)
          echo "{\"name\":\"$VNAME\",\"code\":${{ github.run_number }}}" > desktop/version.json
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Notes \
            --icon desktop/icon.ico \
            --add-data "app/src/main/assets;web" \
            --add-data "desktop/platform.js;." \
            --add-data "desktop/version.json;." \
            --add-data "desktop/icon.png;." \
            desktop/main.py

      - name: Package folder
        run: |
          mkdir -p out/Notes
          cp -r dist/Notes/. out/Notes/
          cp desktop/pack/windows/*.bat out/Notes/
          cd out && python -c "import shutil; shutil.make_archive('Notes-windows','zip','.','Notes')"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VNAME=$(tr -d '[:space:]' < VERSION)
          gh release delete windows-latest --cleanup-tag --yes || true
          gh release create windows-latest out/Notes-windows.zip \
            --title "Notes $VNAME windows (Build ${{ github.run_number }})" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest=false
